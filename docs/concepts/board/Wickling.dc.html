<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { vibe: 'all', tab: 'body', body: 0, pattern: 'solid', pattC: 1, eyes: 'round', mouth: 'smile', top: 'hoodie', topC: 6, bot: 'shorts', botC: 5, hat: 'none', hatC: 2, flame: 0, emote: 'idle', preset: 'Custom' };
  }
  shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
    r = Math.round(r + (t - r) * p); g = Math.round(g + (t - g) * p); b = Math.round(b + (t - b) * p);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }
  renderVals() {
    const st = this.state, sh = (h, a) => this.shade(h, a);
    // colors carry a vibe too: soft pastels feel cute, deep and bold colors feel cool
    const BODY = ['#9B7BFF', '#FF7FB0', '#4FE0B0', '#5AA8FF', '#FFB547', '#FF6B6B', '#C8F25A', '#F4EEE6', '#6B5CA5', '#2E2B44', '#FFC8DD', '#C9B8FF', '#BDE8D8', '#14161F', '#B3242E', '#1E4FD9'];
    const BODY_V = ['', 'cute', '', '', '', 'cool', 'cool', 'cute', 'cool', 'cool', 'cute', 'cute', 'cute', 'cool', 'cool', 'cool'];
    const CLOTH = ['#7C5CFF', '#FF5C8A', '#2BB98A', '#3D8BFF', '#F2A541', '#2B2F45', '#F4F2FF', '#B0453A', '#FFE066', '#1FB6C9'];
    const FLAMES = [['#FF7A1A', '#FFD34D', 'Classic'], ['#7C5CFF', '#FF4FD8', 'Ultraviolet'], ['#14C08A', '#8CFFD9', 'Mint'], ['#E9A21C', '#FFF1A8', 'Gold'], ['#2F7BFF', '#9FE3FF', 'Ice']];
    const TABS = [['body', 'Body'], ['eyes', 'Eyes'], ['mouth', 'Mouth'], ['top', 'Top'], ['bot', 'Bottom'], ['hat', 'Head'], ['flame', 'Flame']];
    // [id, name, price, vibe] — vibe '' fits both
    const OPT = {
      body: [['solid', 'Solid', '', ''], ['stripes', 'Stripes', '', ''], ['dots', 'Dots', '100', 'cute'], ['hearts', 'Hearts', '300', 'cute'], ['bolts', 'Lightning', '300', 'cool'], ['split', 'Two-tone', '300', 'cool'], ['candles', 'Candles', '500', '']],
      eyes: [['round', 'Shiny', '', 'cute'], ['happy', 'Happy', '', 'cute'], ['star', 'Starry', '300', 'cute'], ['focus', 'Locked in', '', 'cool'], ['shades', 'Shades', '500', 'cool']],
      mouth: [['smile', 'Smile', '', ''], ['cat', 'Cheeky', '', 'cute'], ['o', 'Whoa', '100', 'cute'], ['grin', 'Grin', '', 'cool']],
      top: [['none', 'None', '', ''], ['tee', 'Tee', '', ''], ['hoodie', 'Hoodie', '', 'cool'], ['puffer', 'Puffer', '500', 'cute'], ['varsity', 'Varsity', '800', 'cool']],
      bot: [['none', 'None', '', ''], ['shorts', 'Shorts', '', ''], ['skirt', 'Skirt', '', 'cute'], ['overalls', 'Overalls', '500', 'cute']],
      hat: [['none', 'None', '', ''], ['bow', 'Bow', '', 'cute'], ['bunny', 'Bunny ears', '500', 'cute'], ['bucket', 'Bucket hat', '300', 'cute'], ['cap', 'Cap', '', 'cool'], ['beanie', 'Beanie', '300', 'cool'], ['phones', 'Headphones', '', 'cool'], ['crown', 'Crown', 'League', '']],
      flame: FLAMES.map((f, i) => [String(i), f[2], i === 0 ? '' : i === 3 ? 'Gold league' : '300', i === 1 ? 'cute' : i === 4 ? 'cool' : '']),
    };
    const fits = (v) => st.vibe === 'all' || !v || v === st.vibe;
    const PAL = { body: ['body', BODY, 'Body color', BODY_V], top: ['topC', CLOTH, 'Top color'], bot: ['botC', CLOTH, 'Bottom color'], hat: ['hatC', CLOTH, 'Head color'] };
    const body = BODY[st.body], top = CLOTH[st.topC], bot = CLOTH[st.botC], hat = CLOTH[st.hatC], fl = FLAMES[st.flame];
    const patt = st.pattern === 'split' ? sh(BODY[(st.body + 3) % BODY.length], 0) : sh(body, st.body === 7 ? -0.25 : 0.4);
    const c = {
      body, bodyHi: sh(body, 0.35), bodyLo: sh(body, -0.28),
      top, topHi: sh(top, 0.2), topLo: sh(top, -0.28), bot, botHi: sh(bot, 0.2), botLo: sh(bot, -0.3),
      hatHi: sh(hat, 0.25), hatLo: sh(hat, -0.3), flameA: fl[0], flameB: fl[1], patt,
      legs: st.bot === 'none' || st.bot === 'skirt' ? sh(body, -0.15) : sh(bot, -0.1),
      shoe: '#F4F2FF',
      arm: st.top === 'none' || st.top === 'tee' ? sh(body, -0.05) : st.top === 'varsity' ? '#E9E6F5' : sh(top, -0.05),
    };
    const anim = { idle: 'animation: wkIdle 1.6s ease-in-out infinite', jump: 'animation: wkJump .9s cubic-bezier(.3,.7,.4,1) infinite', dance: 'animation: wkDance .8s ease-in-out infinite', wave: 'animation: wkIdle 1.6s ease-in-out infinite' }[st.emote];
    const PRESETS = [
      { name: 'Sakura', vibe: 'cute', dot: '#FF7FB0', s: { body: 1, pattern: 'dots', eyes: 'happy', mouth: 'cat', top: 'puffer', topC: 6, bot: 'skirt', botC: 0, hat: 'bow', hatC: 1, flame: 1 } },
      { name: 'Bunny', vibe: 'cute', dot: '#FFC8DD', s: { body: 10, pattern: 'hearts', eyes: 'round', mouth: 'o', top: 'none', topC: 0, bot: 'overalls', botC: 3, hat: 'bunny', hatC: 6, flame: 1 } },
      { name: 'Matcha', vibe: 'cute', dot: '#BDE8D8', s: { body: 12, pattern: 'solid', eyes: 'star', mouth: 'smile', top: 'tee', topC: 6, bot: 'shorts', botC: 2, hat: 'bucket', hatC: 2, flame: 2 } },
      { name: 'Night shift', vibe: 'cool', dot: '#14161F', s: { body: 13, pattern: 'bolts', eyes: 'shades', mouth: 'grin', top: 'hoodie', topC: 5, bot: 'shorts', botC: 5, hat: 'phones', hatC: 9, flame: 4 } },
      { name: 'Bull run', vibe: 'cool', dot: '#4FE0B0', s: { body: 2, pattern: 'candles', eyes: 'focus', mouth: 'grin', top: 'tee', topC: 5, bot: 'shorts', botC: 5, hat: 'cap', hatC: 2, flame: 2 } },
      { name: 'Varsity', vibe: 'cool', dot: '#B3242E', s: { body: 14, pattern: 'split', eyes: 'focus', mouth: 'smile', top: 'varsity', topC: 5, bot: 'shorts', botC: 6, hat: 'beanie', hatC: 5, flame: 0 } },
      { name: 'Gold league', vibe: '', dot: '#FFB547', s: { body: 4, pattern: 'stripes', eyes: 'star', mouth: 'o', top: 'none', topC: 0, bot: 'overalls', botC: 3, hat: 'crown', hatC: 0, flame: 3 } },
    ];
    const tabKey = st.tab;
    const pal = PAL[tabKey];
    const cur = { body: st.pattern, eyes: st.eyes, mouth: st.mouth, top: st.top, bot: st.bot, hat: st.hat, flame: String(st.flame) }[tabKey];
    const setKey = { body: 'pattern', eyes: 'eyes', mouth: 'mouth', top: 'top', bot: 'bot', hat: 'hat', flame: 'flame' }[tabKey];
    const hatOn = ['cap', 'beanie', 'bucket', 'crown'].includes(st.hat);
    return {
      c, anim,
      glow: sh(body, -0.1) + '88',
      waveAnim: st.emote === 'wave' ? 'animation: wkWave .5s ease-in-out infinite' : '',
      flameT: hatOn ? 'translate(0 -26)' : 'translate(0 0)',
      presetName: st.preset === 'Custom' ? 'Mix and match every piece' : st.preset + ' squad look',
      vibes: [['cute', 'Cute'], ['cool', 'Cool'], ['all', 'Both']].map((v) => ({ label: v[1], pick: () => this.setState({ vibe: v[0] }),
        style: 'flex: 1; min-height: 32px; border-radius: 999px; border: 0; font-weight: 800; font-size: 13px; color: ' + (st.vibe === v[0] ? '#0B0920' : '#F4F2FF') + '; background: ' + (st.vibe === v[0] ? (v[0] === 'cute' ? '#FFB8D2' : v[0] === 'cool' ? '#7FE9FF' : '#F4F2FF') : 'transparent') })),
      p: { hearts: st.pattern === 'hearts', bolts: st.pattern === 'bolts', stripes: st.pattern === 'stripes', dots: st.pattern === 'dots', split: st.pattern === 'split', candles: st.pattern === 'candles' },
      f: { shades: st.eyes === 'shades', round: st.eyes === 'round', happy: st.eyes === 'happy', focus: st.eyes === 'focus', star: st.eyes === 'star' },
      m: { smile: st.mouth === 'smile', grin: st.mouth === 'grin', cat: st.mouth === 'cat', o: st.mouth === 'o' },
      t: { hoodie: st.top === 'hoodie', tee: st.top === 'tee', varsity: st.top === 'varsity', puffer: st.top === 'puffer' },
      b: { shorts: st.bot === 'shorts', skirt: st.bot === 'skirt', overalls: st.bot === 'overalls' },
      h: { bunny: st.hat === 'bunny', bow: st.hat === 'bow', cap: st.hat === 'cap', beanie: st.hat === 'beanie', bucket: st.hat === 'bucket', phones: st.hat === 'phones', crown: st.hat === 'crown' },
      emotes: [['idle', 'Idle'], ['wave', 'Wave'], ['jump', 'Jump'], ['dance', 'Dance']].map((e) => ({ label: e[1], pick: () => this.setState({ emote: e[0] }),
        style: 'min-height: 34px; padding: 0 12px; border-radius: 999px; font-weight: 700; font-size: 12px; border: 1px solid rgba(255,255,255,.16); color: ' + (st.emote === e[0] ? '#0B0920' : '#F4F2FF') + '; background: ' + (st.emote === e[0] ? '#F4F2FF' : 'rgba(11,9,32,.6)') })),
      tabs: TABS.map((t) => ({ label: t[1], pick: () => this.setState({ tab: t[0] }),
        style: 'flex: none; min-height: 36px; padding: 0 13px; border-radius: 999px; font-weight: 700; font-size: 13px; border: 1px solid ' + (tabKey === t[0] ? 'transparent' : 'rgba(255,255,255,.14)') + '; color: ' + (tabKey === t[0] ? '#0B0920' : '#F4F2FF') + '; background: ' + (tabKey === t[0] ? '#F4F2FF' : 'rgba(255,255,255,.06)') })),
      options: OPT[tabKey].filter((o) => fits(o[3]) || cur === o[0]).map((o) => {
        const on = cur === o[0];
        const gem = o[2] && /^\d+$/.test(o[2]);
        return { label: o[1], price: !o[2] ? 'Free' : gem ? o[2] + ' gems' : o[2],
          priceStyle: 'font-size: 11px; font-weight: 700; color: ' + (!o[2] ? '#A9A4CC' : gem ? '#7FE9FF' : '#FFC94A'),
          pick: () => this.setState({ [setKey]: setKey === 'flame' ? +o[0] : o[0], preset: 'Custom' }),
          style: 'min-height: 58px; padding: 6px 4px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; background: ' + (on ? 'rgba(124,92,255,.3)' : 'rgba(255,255,255,.06)') + '; border: 1.5px solid ' + (on ? '#B69CFF' : 'rgba(255,255,255,.1)') };
      }),
      colors: pal ? pal[1].map((col, i) => ({ i, col })).filter((x) => !pal[3] || fits(pal[3][x.i]) || st[pal[0]] === x.i).map(({ col, i }) => ({ label: pal[2] + ' ' + (i + 1), pick: () => this.setState({ [pal[0]]: i, preset: 'Custom' }),
        style: 'width: 30px; height: 30px; border-radius: 50%; padding: 0; background: radial-gradient(circle at 35% 30%, ' + sh(col, .35) + ', ' + col + ' 55%, ' + sh(col, -.25) + '); border: 3px solid ' + (st[pal[0]] === i ? '#FFC94A' : 'rgba(255,255,255,.1)') })) : [],
      presets: PRESETS.filter((p) => fits(p.vibe)).map((p) => ({ name: p.name, pick: () => this.setState(Object.assign({}, p.s, { preset: p.name })),
        dot: 'width: 12px; height: 12px; border-radius: 50%; background: ' + p.dot,
        style: 'display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 12px; border-radius: 999px; font-weight: 700; font-size: 12px; color: #F4F2FF; background: ' + (st.preset === p.name ? 'rgba(124,92,255,.3)' : 'rgba(255,255,255,.06)') + '; border: 1px solid ' + (st.preset === p.name ? '#B69CFF' : 'rgba(255,255,255,.12)') })),
      shuffle: () => {
        const r = (n) => Math.floor(Math.random() * n);
        const pool = (k) => OPT[k].filter((o) => fits(o[3]));
        const pk = (k) => { const a = pool(k); return a[r(a.length)][0]; };
        const bodies = BODY.map((c, i) => i).filter((i) => fits(BODY_V[i]));
        this.setState({ body: bodies[r(bodies.length)], pattern: pk('body'), pattC: 1, eyes: pk('eyes'), mouth: pk('mouth'), top: pk('top'), topC: r(CLOTH.length), bot: pk('bot'), botC: r(CLOTH.length), hat: pk('hat'), hatC: r(CLOTH.length), flame: r(FLAMES.length), preset: 'Custom', emote: 'jump' });
      },
    };
  }
}
