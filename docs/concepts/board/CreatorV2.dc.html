<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { tab: 'hair', face: 'smile', skin: 3, hair: 'swoop', hairC: 0, top: 'hoodie', topC: 0, bot: 'pants', botC: 1, shoe: 'sneakers', shoeC: 0, acc: 'none', accC: 0 };
  }
  shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
    r = Math.round(r + (t - r) * p); g = Math.round(g + (t - g) * p); b = Math.round(b + (t - b) * p);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }
  renderVals() {
    const st = this.state;
    const SKIN = ['#FCE3D0', '#F5CBA7', '#E8AE84', '#CF8E62', '#AE6E44', '#8A5332', '#6B3E24', '#4A2A18'];
    const HAIR = ['#2A1E3A', '#5A3420', '#9A6234', '#E2B865', '#F2E3B8', '#FF7FB8', '#6FA8FF', '#B69CFF', '#3CE0A0'];
    const CLOTH = ['#7C5CFF', '#FF5C8A', '#2BB98A', '#3D8BFF', '#F2A541', '#2B2F45', '#F4F2FF', '#B0453A', '#E9D6C0'];
    const ACC = ['#2B2F45', '#F4F2FF', '#FF4FD8', '#FFC94A', '#3CFFB1', '#3D8BFF'];
    const TABS = [['face', 'Face'], ['hair', 'Hair'], ['top', 'Top'], ['bot', 'Bottoms'], ['shoe', 'Shoes'], ['acc', 'Extras']];
    const OPT = {
      face: [['smile', 'Smile', ''], ['hype', 'Hype', ''], ['chill', 'Chill', ''], ['happy', 'Happy', ''], ['wink', 'Wink', '150']],
      hair: [['buzz', 'Buzz', ''], ['swoop', 'Swoop', ''], ['curls', 'Curls', ''], ['long', 'Long', ''], ['bob', 'Bob', ''], ['buns', 'Space buns', '200'], ['braids', 'Braids', ''], ['afro', 'Big curls', '200']],
      top: [['hoodie', 'Hoodie', ''], ['tee', 'Tee', ''], ['puffer', 'Puffer', '400'], ['varsity', 'Varsity', '600']],
      bot: [['pants', 'Joggers', ''], ['cargo', 'Cargos', '250'], ['shorts', 'Shorts', ''], ['skirt', 'Pleated skirt', '250']],
      shoe: [['sneakers', 'Runners', ''], ['hightops', 'High-tops', '300'], ['boots', 'Boots', '300'], ['slides', 'Slides', '']],
      acc: [['none', 'None', ''], ['headphones', 'Headphones', ''], ['cap', 'Cap', '150'], ['beanie', 'Beanie', '150'], ['glasses', 'Glasses', ''], ['chain', 'Chain', '500']],
    };
    const PAL = { face: ['skin', SKIN, 'Skin tone'], hair: ['hairC', HAIR, 'Hair color'], top: ['topC', CLOTH, 'Top color'], bot: ['botC', CLOTH, 'Bottoms color'], shoe: ['shoeC', CLOTH, 'Shoe color'], acc: ['accC', ACC, 'Extra color'] };
    const sh = (h, a) => this.shade(h, a);
    const skin = SKIN[st.skin], hair = HAIR[st.hairC], top = CLOTH[st.topC], bot = CLOTH[st.botC], shoe = CLOTH[st.shoeC], acc = ACC[st.accC];
    const c = {
      skin, skinHi: sh(skin, 0.25), skinLo: sh(skin, -0.22),
      hair, hairHi: sh(hair, 0.3), hairLo: sh(hair, -0.35),
      top, topHi: sh(top, 0.25), topLo: sh(top, -0.3),
      bot, botHi: sh(bot, 0.2), botLo: sh(bot, -0.3),
      shoeHi: sh(shoe, 0.2), shoeLo: sh(shoe, -0.3),
      accHi: sh(acc, 0.3), accLo: sh(acc, -0.3),
      sleeve: st.top === 'varsity' ? '#E9E6F5' : sh(top, -0.12),
    };
    const f = st.face, h = st.hair, a = st.acc;
    const v = {
      eyesRound: f === 'smile' || f === 'hype', eyesHappy: f === 'happy', eyesChill: f === 'chill', eyesWink: f === 'wink',
      mouthSmile: f === 'smile' || f === 'happy' || f === 'wink', mouthGrin: f === 'hype', mouthSmirk: f === 'chill',
      hairBuzz: h === 'buzz', hairSwoop: h === 'swoop', hairCurls: h === 'curls' || h === 'afro', hairFringe: h === 'long' || h === 'braids', hairBangs: h === 'bob', hairBuns: h === 'buns',
      hairLongBack: h === 'long' || h === 'afro', hairBobBack: h === 'bob', hairBraids: h === 'braids',
      hoodie: st.top === 'hoodie', tee: st.top === 'tee', puffer: st.top === 'puffer', varsity: st.top === 'varsity',
      pants: st.bot === 'pants' || st.bot === 'cargo', cargo: st.bot === 'cargo', shorts: st.bot === 'shorts', skirt: st.bot === 'skirt', legsSkin: st.bot === 'shorts' || st.bot === 'skirt',
      sneakers: st.shoe === 'sneakers', hightops: st.shoe === 'hightops', boots: st.shoe === 'boots', slides: st.shoe === 'slides',
      headphones: a === 'headphones', cap: a === 'cap', beanie: a === 'beanie', glasses: a === 'glasses', chain: a === 'chain',
    };
    const tabKey = st.tab, styleKey = { face: 'face', hair: 'hair', top: 'top', bot: 'bot', shoe: 'shoe', acc: 'acc' }[tabKey];
    const [palKey, palList, palLabel] = PAL[tabKey];
    const name = (k) => OPT[k].find((o) => o[0] === st[k])[1];
    return {
      c, v,
      stageGlow: 'rgba(124,92,255,.55)',
      equipped: name('hair') + ' · ' + name('top') + ' · ' + name('shoe'),
      tabs: TABS.map((t) => ({ label: t[1], pick: () => this.setState({ tab: t[0] }),
        style: 'flex: none; min-height: 38px; padding: 0 14px; border-radius: 999px; font-weight: 700; font-size: 13px; border: 1px solid ' + (tabKey === t[0] ? 'transparent' : 'rgba(255,255,255,.14)') + '; color: ' + (tabKey === t[0] ? '#0B0920' : '#F4F2FF') + '; background: ' + (tabKey === t[0] ? '#F4F2FF' : 'rgba(255,255,255,.06)') })),
      options: OPT[tabKey].map((o) => {
        const on = st[styleKey] === o[0];
        return { label: o[1], price: o[2] ? o[2] + ' coins' : 'Free',
          priceStyle: 'font-size: 11px; font-weight: 700; color: ' + (o[2] ? '#FFC94A' : '#A9A4CC'),
          pick: () => this.setState({ [styleKey]: o[0] }),
          style: 'min-height: 64px; padding: 8px 4px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-align: center; background: ' + (on ? 'rgba(124,92,255,.3)' : 'rgba(255,255,255,.06)') + '; border: 1.5px solid ' + (on ? '#B69CFF' : 'rgba(255,255,255,.1)') };
      }),
      colors: palList.map((col, i) => ({ label: palLabel + ' ' + (i + 1), pick: () => this.setState({ [palKey]: i }),
        style: 'width: 34px; height: 34px; border-radius: 50%; padding: 0; background: radial-gradient(circle at 35% 30%, ' + sh(col, 0.3) + ', ' + col + ' 55%, ' + sh(col, -0.25) + '); border: 3px solid ' + (st[palKey] === i ? '#FFC94A' : 'rgba(255,255,255,.1)') })),
      shuffle: () => {
        const r = (n) => Math.floor(Math.random() * n);
        const pickOpt = (k) => OPT[k][r(OPT[k].length)][0];
        this.setState({ face: pickOpt('face'), hair: pickOpt('hair'), top: pickOpt('top'), bot: pickOpt('bot'), shoe: pickOpt('shoe'), acc: pickOpt('acc'), skin: r(SKIN.length), hairC: r(HAIR.length), topC: r(CLOTH.length), botC: r(CLOTH.length), shoeC: r(CLOTH.length), accC: r(ACC.length) });
      },
    };
  }
}
</script>
