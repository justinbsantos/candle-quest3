<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Room styles</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B69CFF}a:hover{color:#fff}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: radial-gradient(120% 60% at 80% 0%, #2A1B66 0%, #0B0920 60%); color: #F4F2FF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; padding: 22px 18px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="font-family: Unbounded, sans-serif; font-weight: 700; font-size: 20px">My room</div>
    <div style="display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); font-family: Unbounded, sans-serif; font-weight: 700; font-size: 15px"><span style="width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #FFE69A, #FFC94A 60%, #C98A1A)"></span>4,820</div>
  </div>

  <div style="{{roomStyle}}">
    <div style="{{windowStyle}}">
      <div style="position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; background: rgba(255,255,255,.35)"></div>
      <div style="position: absolute; top: 50%; left: 0; right: 0; height: 3px; background: rgba(255,255,255,.35)"></div>
    </div>
    <sc-if value="{{cozy}}" hint-placeholder-val="{{ true }}">
      <div style="position: absolute; top: 18px; left: 10px; right: 10px; height: 20px; display: flex; justify-content: space-between; align-items: flex-end">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #FFE3A3; box-shadow: 0 0 10px #FFE3A3"></span><span style="width: 8px; height: 8px; border-radius: 50%; background: #FFC1D9; box-shadow: 0 0 10px #FFC1D9; margin-bottom: 6px"></span><span style="width: 8px; height: 8px; border-radius: 50%; background: #FFE3A3; box-shadow: 0 0 10px #FFE3A3; margin-bottom: 10px"></span><span style="width: 8px; height: 8px; border-radius: 50%; background: #C9F2DF; box-shadow: 0 0 10px #C9F2DF; margin-bottom: 6px"></span><span style="width: 8px; height: 8px; border-radius: 50%; background: #FFE3A3; box-shadow: 0 0 10px #FFE3A3"></span><span style="width: 8px; height: 8px; border-radius: 50%; background: #FFC1D9; box-shadow: 0 0 10px #FFC1D9; margin-bottom: 6px"></span><span style="width: 8px; height: 8px; border-radius: 50%; background: #FFE3A3; box-shadow: 0 0 10px #FFE3A3; margin-bottom: 10px"></span><span style="width: 8px; height: 8px; border-radius: 50%; background: #C9F2DF; box-shadow: 0 0 10px #C9F2DF; margin-bottom: 6px"></span><span style="width: 8px; height: 8px; border-radius: 50%; background: #FFE3A3; box-shadow: 0 0 10px #FFE3A3"></span>
      </div>
      <div style="position: absolute; left: 22px; bottom: 74px; width: 34px; height: 46px; border-radius: 20px 20px 8px 8px; background: #8FCB9B"></div>
      <div style="position: absolute; left: 26px; bottom: 58px; width: 26px; height: 20px; border-radius: 4px; background: #E9B38E"></div>
      <div style="position: absolute; right: 26px; bottom: 58px; width: 30px; height: 28px; border-radius: 50% 50% 40% 40%; background: #F7D6E0"></div>
      <div style="position: absolute; right: 30px; bottom: 80px; width: 8px; height: 8px; border-radius: 50%; background: #F7D6E0"></div>
      <div style="position: absolute; right: 44px; bottom: 80px; width: 8px; height: 8px; border-radius: 50%; background: #F7D6E0"></div>
    </sc-if>
    <sc-if value="{{gamer}}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; top: 22px; left: 18px; padding: 4px 10px; border-radius: 8px; border: 2px solid #3CFFB1; color: #3CFFB1; font-family: Unbounded, sans-serif; font-size: 11px; font-weight: 700; box-shadow: 0 0 14px rgba(60,255,177,.6)">TAKE PROFIT</div>
      <div style="position: absolute; left: 0; right: 0; bottom: 58px; height: 4px; background: linear-gradient(90deg, #FF4FD8, #7C5CFF, #3CFFB1); box-shadow: 0 0 16px #7C5CFF"></div>
      <div style="position: absolute; left: 20px; bottom: 62px; width: 26px; height: 60px; border-radius: 6px; background: #1E1A33; border: 1px solid #FF4FD8"></div>
    </sc-if>
    <sc-if value="{{minimal}}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; left: 24px; top: 30px; width: 54px; height: 70px; background: #EDE6DA; border: 4px solid #C9B79C"></div>
      <div style="position: absolute; right: 24px; bottom: 58px; width: 22px; height: 80px; border-radius: 12px 12px 4px 4px; background: #6F8F6A"></div>
      <div style="position: absolute; right: 22px; bottom: 58px; width: 26px; height: 18px; border-radius: 3px; background: #D9CBB4"></div>
    </sc-if>
    <sc-if value="{{street}}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; left: 14px; top: 26px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; width: 96px">
        <div style="height: 16px; border-radius: 8px 12px 4px 4px; background: #FF4D6D"></div><div style="height: 16px; border-radius: 8px 12px 4px 4px; background: #F4F2FF"></div><div style="height: 16px; border-radius: 8px 12px 4px 4px; background: #FFC94A"></div>
        <div style="height: 16px; border-radius: 8px 12px 4px 4px; background: #3D8BFF"></div><div style="height: 16px; border-radius: 8px 12px 4px 4px; background: #1B1430; border: 1px solid #555"></div><div style="height: 16px; border-radius: 8px 12px 4px 4px; background: #3CFFB1"></div>
      </div>
      <div style="position: absolute; right: 22px; top: 30px; width: 44px; height: 60px; background: #FF4D6D; transform: rotate(4deg); display: flex; align-items: center; justify-content: center; font-family: Unbounded, sans-serif; font-size: 10px; font-weight: 700; color: #fff">BULL</div>
    </sc-if>
    <div style="{{deskStyle}}"></div>
    <div style="position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); display: flex; gap: 6px">
      <div style="{{screenStyle}}"><svg width="60" height="32" viewBox="0 0 60 32"><path d="M2 26 L12 20 L20 23 L30 12 L38 16 L48 6 L58 9" stroke="#3CFFB1" stroke-width="2.5" fill="none" stroke-linecap="round"></path></svg></div>
      <div style="{{screenStyle}}"><svg width="60" height="32" viewBox="0 0 60 32"><rect x="6" y="10" width="5" height="14" fill="#3CFFB1"></rect><rect x="16" y="6" width="5" height="16" fill="#FF4D6D"></rect><rect x="26" y="12" width="5" height="12" fill="#3CFFB1"></rect><rect x="36" y="4" width="5" height="18" fill="#3CFFB1"></rect><rect x="46" y="8" width="5" height="10" fill="#FF4D6D"></rect></svg></div>
    </div>
    <div style="{{floorStyle}}"></div>
  </div>

  <div style="display: flex; align-items: baseline; justify-content: space-between">
    <div style="font-family: Unbounded, sans-serif; font-weight: 700; font-size: 16px">Pick your vibe</div>
    <div style="font-size: 12px; color: #A9A4CC">Same perks, your look</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{styles}}" as="s" hint-placeholder-count="4">
      <button onClick="{{s.pick}}" style="{{s.card}}">
        <div style="display: flex; gap: 4px">
          <span style="{{s.c1}}"></span><span style="{{s.c2}}"></span><span style="{{s.c3}}"></span>
        </div>
        <div style="font-family: Unbounded, sans-serif; font-weight: 700; font-size: 14px; color: #F4F2FF">{{s.name}}</div>
        <div style="font-size: 12px; color: #A9A4CC; line-height: 1.35">{{s.desc}}</div>
        <div style="font-size: 12px; font-weight: 700; color: #FFC94A">{{s.price}}</div>
      </button>
    </sc-for>
  </div>

  <button style="margin-top: auto; min-height: 52px; border-radius: 999px; border: 0; background: linear-gradient(135deg, #7C5CFF, #FF4FD8); color: #fff; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 16px">Use {{current}} style</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { style: 'cozy' }; }
  renderVals() {
    const S = {
      cozy: { name: 'Cozy', desc: 'Fairy lights, plants, plushies', price: 'Owned', wall: '#5E4A78', wall2: '#7B5F8E', floor: '#B98B6E', desk: '#E8C9A6', win: '#FFB98A', screen: '#2A2140', cols: ['#F7D6E0', '#FFE3A3', '#8FCB9B'] },
      gamer: { name: 'Gamer', desc: 'RGB strips, neon, big screens', price: '1,200 coins', wall: '#14112A', wall2: '#1F1A40', floor: '#25204A', desk: '#2B2550', win: '#3A2E8C', screen: '#0B0920', cols: ['#FF4FD8', '#7C5CFF', '#3CFFB1'] },
      minimal: { name: 'Clean', desc: 'White desk, wood, calm', price: '1,200 coins', wall: '#E9E4DC', wall2: '#F4F0EA', floor: '#C9B79C', desk: '#FAFAF7', win: '#BFE0F5', screen: '#1E2230', cols: ['#FAFAF7', '#C9B79C', '#6F8F6A'] },
      street: { name: 'Street', desc: 'Sneaker wall, posters, drip', price: '1,500 coins', wall: '#2C2C34', wall2: '#3A3A44', floor: '#55505E', desk: '#1B1B22', win: '#FF8A5C', screen: '#0E0E14', cols: ['#FF4D6D', '#FFC94A', '#F4F2FF'] },
    };
    const cur = S[this.state.style];
    const sw = (c) => 'width: 16px; height: 16px; border-radius: 50%; background: ' + c + '; border: 1px solid rgba(255,255,255,.25)';
    return {
      cozy: this.state.style === 'cozy', gamer: this.state.style === 'gamer', minimal: this.state.style === 'minimal', street: this.state.style === 'street',
      current: cur.name,
      roomStyle: 'position: relative; height: 270px; border-radius: 28px; overflow: hidden; border: 1px solid rgba(255,255,255,.14); background: linear-gradient(180deg, ' + cur.wall2 + ', ' + cur.wall + ')',
      windowStyle: 'position: absolute; top: 34px; left: 50%; transform: translateX(-50%); width: 110px; height: 76px; border-radius: 10px; background: linear-gradient(180deg, ' + cur.win + ', rgba(255,255,255,.25)); border: 4px solid rgba(255,255,255,.4); overflow: hidden',
      deskStyle: 'position: absolute; left: 50%; bottom: 58px; transform: translateX(-50%); width: 200px; height: 38px; border-radius: 8px 8px 0 0; background: ' + cur.desk,
      screenStyle: 'width: 72px; height: 44px; border-radius: 6px; background: ' + cur.screen + '; border: 3px solid #0B0920; display: flex; align-items: center; justify-content: center',
      floorStyle: 'position: absolute; left: 0; right: 0; bottom: 0; height: 58px; background: ' + cur.floor,
      styles: Object.keys(S).map((k) => {
        const v = S[k], on = this.state.style === k;
        return { name: v.name, desc: v.desc, price: v.price, c1: sw(v.cols[0]), c2: sw(v.cols[1]), c3: sw(v.cols[2]),
          card: 'text-align: left; display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 20px; min-height: 120px; background: ' + (on ? 'rgba(255,201,74,.12)' : 'rgba(255,255,255,.06)') + '; border: 1px solid ' + (on ? '#FFC94A' : 'rgba(255,255,255,.14)'),
          pick: () => this.setState({ style: k }) };
      }),
    };
  }
}
</script>
</body>
</html>
